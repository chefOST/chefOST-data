[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chefost-eval"
version = "0.1.0"
description = "Shared ChefOST saved-prediction evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
arrays = ["numpy>=1.24"]
mapping = ["openai>=2"]
embeddings = ["sentence-transformers>=2.7", "transformers>=4.51"]
cloud = ["modal>=1.6.1"]
test = ["pytest>=8"]

[project.scripts]
chefost-eval = "chefost_eval.__main__:main"
chefost-prepare-mapping = "chefost_eval.prepare_mapping:main"

[tool.setuptools.packages.find]
include = ["chefost_eval*", "training_support*"]

[tool.setuptools.package-data]
chefost_eval = ["ingredients.json"]
"training_support.vidosc_legacy" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
